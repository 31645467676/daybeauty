<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DISUYAREN·低俗雅人</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="header">
    <h1 id="titleClick">每日一句 · 好词好句</h1>
    <p>摘录昨日短句 | 文字自留地</p>
</header>

<!-- 隐藏密码入口（点标题5次出现） -->
<div class="admin-entry" id="adminEntry">
    <input type="password" id="pwd" placeholder="">
    <button onclick="unlock()">解锁</button>
</div>

<!-- 编辑提示（解锁后显示，告诉你怎么更新） -->
<div class="edit-box" id="editBox">
    <h3>✅ 永久保存更新方法</h3>
    <p>1. 复制下方模板</p>
    <p>2. 粘贴到网页代码最上方</p>
    <p>3. 上传GitHub → 永久保存</p>
    <textarea readonly>
<div class="card">
    <div class="date">25.04.26</div>
    <div class="quote">在这里写句子</div>
    <img src="图片链接(可选)">
</div>
    </textarea>
    <button onclick="lockEdit()">关闭</button>
</div>

<main class="container">
    <div id="listWrap">
        <!-- ====================================== -->
        <!-- 👇 每日更新：把模板粘贴到这里 👇 -->

        <!-- 示例卡片（可删除，自己替换） -->
<div class="card">
    <div class="date">24.04.26</div>
    <div class="quote">在拿起笔之前，我是沉默的。</div>
    <img src="">
</div>
  
        <!-- 👆 每日更新区域 👆 -->
        <!-- ====================================== -->
    </div>
    <div class="pagination" id="pageBox"></div>
</main>

<footer class="footer">© 2026 文字收藏</footer>

<script>
// 配置
const CONFIG = { pwd: "8", pageSize: 11 };

// 点标题5次出密码框
let clickNum = 0;
document.getElementById("titleClick").onclick = ()=>{
    clickNum++;
    if(clickNum>=5){
        document.getElementById("adminEntry").style.display="block";
        clickNum=0;
    }
};

// 解锁/锁定
function unlock(){
    if(document.getElementById("pwd").value===CONFIG.pwd){
        document.getElementById("editBox").style.display="block";
        document.getElementById("adminEntry").style.display="none";
    }else alert("密码错误");
}
function lockEdit(){
    document.getElementById("editBox").style.display="none";
}

// 自动分页（11条一页）
let pageNow=1;
function initPage(){
    let list=Array.from(document.querySelectorAll(".card"));
    let total=Math.ceil(list.length/CONFIG.pageSize);
    list.forEach((item,i)=>{
        let s=(pageNow-1)*CONFIG.pageSize;
        let e=pageNow*CONFIG.pageSize;
        item.style.display=i>=s&&i<e?"block":"none";
    });
    let box=document.getElementById("pageBox");
    box.innerHTML="";
    if(total<=1)return;
    for(let i=1;i<=total;i++){
        let btn=document.createElement("button");
        btn.innerText=i;
        btn.className="page-btn"+(i===pageNow?" active":"");
        btn.onclick=()=>{pageNow=i;initPage();};
        box.appendChild(btn);
    }
}
window.onload=initPage;
</script>
</body>
</html>
